name: Debug packages

on:
  push:
    tags:
      - "release-*"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - run: |
          sudo apt update && sudo apt install -y debhelper gawk flex bison openssl libssl-dev libelf-dev libudev-dev libpci-dev libiberty-dev build-essential cmake libdw-dev zlib1g-dev
          git clone https://github.com/acmel/dwarves.git
          pushd dwarves
          mkdir build
          pushd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/
          make
          sudo make install
          popd
          popd
          rm -rf dwarves
          cp config-guest-p4tc-x86 .config
          make listnewconfig >> .config
          make -j$(nproc) deb-pkg
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: "Debug debian packages"
          files: "../*.deb"
